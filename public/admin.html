<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGAMAX · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d; --panel:#111318; --panel-border:#1f232b;
    --accent:#53FC18; --text:#eef1f5; --text-dim:#8b93a1; --danger:#ff4d4d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:32px; width:100%; max-width:420px; }
  h1{ font-family:'Rajdhani',sans-serif; font-size:22px; letter-spacing:.04em; margin-bottom:4px; }
  h1 span{ color:var(--accent); }
  .subtitle{ color:var(--text-dim); font-size:13px; margin-bottom:24px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); }
  input, select{ background:#0a0b0d; border:1px solid var(--panel-border); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; }
  input:focus, select:focus{ outline:none; border-color:var(--accent); }
  button{ width:100%; background:var(--accent); color:#0a0b0d; border:none; font-weight:600; padding:11px; border-radius:8px; cursor:pointer; font-size:14px; margin-top:6px; }
  button:hover{ background:#6bff2e; }
  button.secondary{ background:transparent; border:1px solid var(--panel-border); color:var(--text-dim); margin-top:10px; }
  button.secondary:hover{ border-color:var(--danger); color:var(--danger); }
  .msg{ font-size:13px; margin-top:12px; min-height:16px; }
  .msg.error{ color:var(--danger); }
  .msg.ok{ color:var(--accent); }
  #panel{ display:none; }
</style>
</head>
<body>

<div class="card">
  <h1>MEGA<span>MAX</span> · Admin</h1>
  <div class="subtitle">Solo tú, con tu contraseña, puedes cambiar lo que ve la gente en la página pública.</div>

  <div id="login-form">
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button id="login-btn">Entrar</button>
    <div class="msg error" id="login-msg"></div>
  </div>

  <div id="panel">
    <div class="field">
      <label for="video-url">URL del vídeo del reproductor</label>
      <input type="text" id="video-url" placeholder="https://tu-servidor.com/escena.mp4">
    </div>
    <div class="field">
      <label for="chat-channel">Canal de Kick para el chat (opcional)</label>
      <input type="text" id="chat-channel" placeholder="ej. megamax">
    </div>
    <div class="field">
      <label for="delay-mode">Modo de retraso</label>
      <select id="delay-mode">
        <option value="latam">Modo LATAM</option>
        <option value="reduced">Delay reducido</option>
      </select>
    </div>
    <button id="save-btn">Guardar cambios</button>
    <div class="msg ok" id="save-msg"></div>
    <button class="secondary" id="logout-btn">Cerrar sesión</button>
  </div>
</div>

<script>
  const loginForm = document.getElementById('login-form');
  const panel = document.getElementById('panel');
  const loginMsg = document.getElementById('login-msg');
  const saveMsg = document.getElementById('save-msg');

  async function checkSession(){
    const res = await fetch('/api/admin/check');
    const data = await res.json();
    if(data.isAdmin){ showPanel(); }
  }

  async function showPanel(){
    loginForm.style.display = 'none';
    panel.style.display = 'block';
    const state = await (await fetch('/api/state')).json();
    document.getElementById('video-url').value = state.videoUrl || '';
    document.getElementById('chat-channel').value = state.chatChannel || '';
    document.getElementById('delay-mode').value = state.delayMode || 'latam';
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    loginMsg.textContent = '';
    const password = document.getElementById('password').value;
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password })
    });
    if(res.ok){
      showPanel();
    } else {
      loginMsg.textContent = 'Contraseña incorrecta.';
    }
  });

  document.getElementById('save-btn').addEventListener('click', async () => {
    saveMsg.textContent = '';
    const body = {
      videoUrl: document.getElementById('video-url').value,
      chatChannel: document.getElementById('chat-channel').value,
      delayMode: document.getElementById('delay-mode').value
    };
    const res = await fetch('/api/admin/update', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(res.ok){
      saveMsg.textContent = 'Cambios guardados. Ya se ven en la página pública.';
    } else {
      saveMsg.textContent = 'Error al guardar (¿sesión caducada?).';
      saveMsg.classList.add('error');
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/admin/logout', { method: 'POST' });
    location.reload();
  });

  checkSession();
</script>

</body>
</html>
